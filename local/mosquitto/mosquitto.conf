# Mosquitto for local development and demos: stands in for the operator's
# DJI Cloud API broker. No auth (the connector's username/password are
# accepted but ignored) and no TLS; set "Use TLS" off in the integration.

listener 1883
allow_anonymous true

# The connector reads with a persistent session and only connects for about
# 50 of every 60 seconds. DJI publishes OSD at QoS 0, which Mosquitto does
# not queue for offline sessions unless told to; see the README.
persistence true
persistence_location /mosquitto/data/
queue_qos0_messages true
max_queued_messages 20000
